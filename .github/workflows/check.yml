name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v27

      # `openclaw-workspace` is a local path input locked at
      # /home/vokrob/.config/openclaw; the runner needs it to exist
      - name: Create openclaw workspace placeholders
        run: |
          sudo mkdir -p /home/vokrob/.config/openclaw
          sudo chown -R $USER /home/vokrob
          for f in AGENTS.md SOUL.md TOOLS.md IDENTITY.md USER.md; do
            [ -f /home/vokrob/.config/openclaw/$f ] || echo placeholder > /home/vokrob/.config/openclaw/$f
          done

      - name: Format check
        run: nix fmt -- --check .

      - name: Flake check
        run: nix flake check
